[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nmdviewer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "exifread>=3.5.1",
    "flask>=3.1.2",
    "gunicorn>=25.0.3",
    "loguru>=0.7.3",
    "piexif>=1.1.3",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
]

[tool.setuptools.packages.find]
include = ["nmdviewer*"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "N",
]
preview = true
